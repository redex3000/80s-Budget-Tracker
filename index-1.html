<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0f0800"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="BURN//RATE"/>
<title>BURN//RATE 8.0</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:      #0f0800;
  --panel:   #1a0e00;
  --border:  #ff6600;
  --border2: #ff2200;
  --border3: #ffaa00;
  --text:    #ff8800;
  --text2:   #ff3300;
  --text3:   #ffcc00;
  --dim:     #7a3300;
  --muted:   #2a1400;
  --ember:   #ff4400;
  --gold:    #ffd700;
  --green:   #aaff44;
  --red:     #ff1a1a;
  --smoke:   #3a2010;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* Scanline overlay */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.15) 3px,
    rgba(0,0,0,0.15) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* Heat shimmer flicker on logo */
@keyframes flicker {
  0%,100% { text-shadow: 0 0 8px #ff6600, 0 0 24px #ff3300, 0 0 48px #ff1100; opacity:1; }
  45%      { text-shadow: 0 0 4px #ff6600, 0 0 12px #ff3300; opacity:.92; }
  50%      { text-shadow: 0 0 16px #ff8800, 0 0 32px #ff4400, 0 0 64px #ff2200; opacity:1; }
  90%      { text-shadow: 0 0 6px #ff6600, 0 0 18px #ff3300; opacity:.95; }
}
@keyframes emberPulse {
  0%,100% { box-shadow: 0 0 12px rgba(255,102,0,0.4), 0 0 24px rgba(255,34,0,0.2); }
  50%      { box-shadow: 0 0 20px rgba(255,102,0,0.7), 0 0 40px rgba(255,34,0,0.4); }
}
@keyframes slideIn { from { opacity:0; transform:translateX(-12px); } to { opacity:1; transform:translateX(0); } }
@keyframes blink { 50% { opacity:0; } }

.glow  { animation: flicker 3s infinite; }
.glow2 { text-shadow: 0 0 8px var(--border2), 0 0 20px var(--border2); }
.glow3 { text-shadow: 0 0 8px var(--border3), 0 0 18px var(--border3); }

/* ── Layout ─────────────────────────────────────────── */
#app {
  display: flex; flex-direction: column;
  height: 100dvh; max-width: 480px; margin: 0 auto;
}

/* ── Header ─────────────────────────────────────────── */
header {
  background: var(--bg);
  border-bottom: 2px solid var(--border);
  animation: emberPulse 2.5s infinite;
  padding: 10px 14px 8px;
  flex-shrink: 0;
}
.hdr-row { display: flex; justify-content: space-between; align-items: flex-start; }
.logo {
  font-family: 'VT323', monospace; font-size: 30px;
  color: var(--border); line-height: 1;
  animation: flicker 3s infinite;
}
.logo span { color: var(--border2); }
.logo-sub { font-size: 10px; color: var(--dim); letter-spacing: 2px; margin-top: 2px; }
.clock-block { text-align: right; }
#clock { font-family: 'VT323', monospace; font-size: 28px; color: var(--gold); line-height: 1; text-shadow: 0 0 10px var(--gold); }
#dateline { font-size: 9px; color: var(--dim); letter-spacing: 1px; }

/* Budget burn bar */
.prog-wrap { margin-top: 8px; }
.prog-label { font-size: 9px; color: var(--dim); letter-spacing: 1px; margin-bottom: 3px; display: flex; justify-content: space-between; }
.prog-track { height: 8px; background: var(--muted); position: relative; overflow: hidden; }
.prog-fill {
  height: 100%; background: linear-gradient(90deg, #ff6600, #ff2200);
  transition: width .5s ease;
  box-shadow: 0 0 10px #ff4400;
}
.prog-fill.danger { background: linear-gradient(90deg, #ff2200, #ff0000); box-shadow: 0 0 14px #ff0000; animation: blink .6s step-end infinite; }

/* ── Summary cards ──────────────────────────────────── */
.summary-row {
  display: flex; gap: 6px; padding: 8px 10px;
  background: var(--panel); border-bottom: 1px solid var(--muted);
  flex-shrink: 0;
}
.sum-card {
  flex: 1; background: var(--bg); border: 1px solid var(--dim);
  padding: 7px 8px; text-align: center;
}
.sum-card.highlight { border-color: var(--border); box-shadow: 0 0 8px rgba(255,102,0,0.3); }
.sum-label { font-size: 8px; color: var(--dim); letter-spacing: 1px; margin-bottom: 3px; }
.sum-value { font-family: 'VT323', monospace; font-size: 22px; color: var(--text3); line-height: 1; }
.sum-value.red { color: var(--red); text-shadow: 0 0 8px var(--red); }
.sum-value.green { color: var(--green); text-shadow: 0 0 8px var(--green); }
.sum-value.ember { color: var(--ember); }

/* ── Tabs ───────────────────────────────────────────── */
.tabs {
  display: flex; border-bottom: 1px solid var(--border2);
  background: var(--panel); flex-shrink: 0;
}
.tab {
  flex: 1; padding: 9px 4px; text-align: center;
  font-size: 11px; letter-spacing: 1px; color: var(--dim);
  border: none; background: none; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .2s, border-color .2s;
  font-family: 'Share Tech Mono', monospace;
}
.tab.active { color: var(--border); border-bottom-color: var(--border); }

/* ── Search + Filter ────────────────────────────────── */
.search-bar {
  display: flex; gap: 6px; padding: 8px 10px;
  background: var(--panel); border-bottom: 1px solid var(--muted); flex-shrink: 0;
}
.search-bar input, .search-bar select {
  background: var(--bg); color: var(--text);
  border: 1px solid var(--dim); font-family: 'Share Tech Mono', monospace;
  font-size: 12px; padding: 5px 8px; outline: none;
}
.search-bar input { flex: 1; }
.search-bar input:focus { border-color: var(--border); box-shadow: 0 0 6px rgba(255,102,0,0.4); }
.search-bar select { width: 106px; }

/* ── Expense list ───────────────────────────────────── */
.expense-list {
  flex: 1; overflow-y: auto; padding: 6px 10px;
  -webkit-overflow-scrolling: touch;
}
.expense-list::-webkit-scrollbar { width: 4px; }
.expense-list::-webkit-scrollbar-track { background: var(--bg); }
.expense-list::-webkit-scrollbar-thumb { background: var(--dim); }

.empty-state {
  text-align: center; color: var(--dim);
  padding: 50px 20px; font-size: 13px; line-height: 2;
}
.empty-state .big { font-family: 'VT323', monospace; font-size: 56px; color: var(--muted); display: block; }

/* ── Date group header ──────────────────────────────── */
.date-group { font-size: 9px; color: var(--dim); letter-spacing: 2px; padding: 8px 2px 4px; border-bottom: 1px solid var(--muted); margin-bottom: 4px; }

/* ── Expense card ───────────────────────────────────── */
.exp-card {
  background: var(--panel); border-left: 3px solid var(--dim);
  margin-bottom: 5px; padding: 9px 12px;
  animation: slideIn .2s ease;
}
.exp-card.FOOD     { border-left-color: #ff8800; }
.exp-card.TRAVEL   { border-left-color: #ff4400; }
.exp-card.BILLS    { border-left-color: #ff2200; }
.exp-card.SHOPPING { border-left-color: #ffaa00; }
.exp-card.HEALTH   { border-left-color: #ff6600; }
.exp-card.ENTERTAINMENT { border-left-color: #ffcc00; }
.exp-card.OTHER    { border-left-color: var(--dim); }

.exp-top { display: flex; align-items: flex-start; gap: 8px; }
.exp-name { flex: 1; font-size: 14px; color: var(--text); line-height: 1.3; word-break: break-word; }
.exp-amount {
  font-family: 'VT323', monospace; font-size: 22px;
  color: var(--gold); line-height: 1; flex-shrink: 0;
  text-shadow: 0 0 6px rgba(255,215,0,0.5);
}
.exp-actions { display: flex; gap: 5px; flex-shrink: 0; margin-left: 6px; }
.exp-btn {
  background: none; border: 1px solid var(--dim); color: var(--dim);
  font-family: 'Share Tech Mono', monospace; font-size: 10px;
  padding: 2px 6px; cursor: pointer; transition: all .15s;
}
.exp-btn.edit:active { border-color: var(--text3); color: var(--text3); }
.exp-btn.del:active  { border-color: var(--red);   color: var(--red); }

.exp-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; align-items: center; }
.tag {
  font-size: 9px; letter-spacing: 1px; padding: 1px 6px;
  border: 1px solid; border-radius: 0;
}
.tag.cat       { border-color: var(--dim); color: var(--dim); }
.tag.recurring { border-color: var(--border3); color: var(--border3); }
.tag.user-tag  { border-color: var(--border2); color: var(--border2); cursor: pointer; }
.tag.user-tag:active { background: var(--border2); color: var(--bg); }
.exp-note { font-size: 11px; color: var(--dim); margin-top: 4px; line-height: 1.4; }

/* ── Tag filter bar ─────────────────────────────────── */
.tag-filter-bar {
  display: flex; gap: 6px; padding: 6px 10px;
  background: var(--bg); border-bottom: 1px solid var(--muted);
  overflow-x: auto; flex-shrink: 0;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.tag-filter-bar::-webkit-scrollbar { display: none; }
.tag-filter-pill {
  flex-shrink: 0; font-size: 10px; letter-spacing: 1px;
  padding: 3px 10px; border: 1px solid var(--dim); color: var(--dim);
  background: none; font-family: 'Share Tech Mono', monospace;
  cursor: pointer; white-space: nowrap; transition: all .15s;
}
.tag-filter-pill.active { border-color: var(--border2); color: var(--border2); background: rgba(255,34,0,0.1); box-shadow: 0 0 6px rgba(255,34,0,0.3); }
.tag-filter-pill.manage { border-color: var(--dim); color: var(--dim); font-size: 9px; }
.tag-filter-pill.manage:active { border-color: var(--border3); color: var(--border3); }

/* ── Tag picker in modal ────────────────────────────── */
.tag-picker {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 8px 0 0;
}
.tag-pick-btn {
  font-size: 10px; letter-spacing: 1px; padding: 3px 10px;
  border: 1px solid var(--dim); color: var(--dim);
  background: none; font-family: 'Share Tech Mono', monospace;
  cursor: pointer; transition: all .15s;
}
.tag-pick-btn.selected { border-color: var(--border2); color: var(--border2); background: rgba(255,34,0,0.12); }

/* ── Tag manager modal ──────────────────────────────── */
.tag-mgr-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.92);
  z-index: 300; display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.tag-mgr-overlay.open { opacity: 1; pointer-events: all; }
.tag-mgr-modal {
  width: 100%; max-width: 480px; background: var(--panel);
  border: 1px solid var(--border2); border-bottom: none;
  box-shadow: 0 0 30px rgba(255,34,0,0.4);
  padding: 0 0 env(safe-area-inset-bottom);
  transform: translateY(100%);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
  max-height: 70dvh; overflow-y: auto;
}
.tag-mgr-overlay.open .tag-mgr-modal { transform: translateY(0); }
.tag-mgr-title {
  font-family: 'VT323', monospace; font-size: 22px; color: var(--border2);
  padding: 14px 16px 8px; border-bottom: 1px solid var(--muted); letter-spacing: 2px;
}
.tag-mgr-list { padding: 8px 16px; }
.tag-mgr-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid var(--muted);
}
.tag-mgr-name { flex: 1; font-size: 13px; color: var(--border2); }
.tag-mgr-count { font-size: 10px; color: var(--dim); }
.tag-del-btn {
  background: none; border: 1px solid var(--dim); color: var(--dim);
  font-family: 'Share Tech Mono', monospace; font-size: 10px;
  padding: 2px 8px; cursor: pointer;
}
.tag-del-btn:active { border-color: var(--red); color: var(--red); }
.tag-create-row { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--muted); }
.tag-create-input {
  flex: 1; background: var(--bg); color: var(--text);
  border: 1px solid var(--dim); font-family: 'Share Tech Mono', monospace;
  font-size: 13px; padding: 7px 10px; outline: none;
}
.tag-create-input:focus { border-color: var(--border2); }
.tag-create-btn {
  background: var(--border2); color: var(--bg);
  border: none; font-family: 'Share Tech Mono', monospace;
  font-size: 12px; padding: 7px 14px; cursor: pointer; letter-spacing: 1px;
}
.tag-mgr-close {
  display: block; width: calc(100% - 32px); margin: 0 16px 14px;
  background: none; border: 1px solid var(--dim); color: var(--dim);
  font-family: 'Share Tech Mono', monospace; font-size: 12px;
  padding: 9px; cursor: pointer; letter-spacing: 2px;
}
.tag-mgr-close:active { border-color: var(--border); color: var(--border); }

/* ── Budget tab ─────────────────────────────────────── */
.budget-section { padding: 10px; overflow-y: auto; flex: 1; }
.budget-card {
  background: var(--panel); border: 1px solid var(--dim);
  margin-bottom: 8px; padding: 12px;
}
.budget-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.budget-cat { font-size: 13px; color: var(--text); letter-spacing: 1px; }
.budget-amounts { font-family: 'VT323', monospace; font-size: 18px; color: var(--text3); }
.budget-amounts .spent { color: var(--ember); }
.budget-amounts .over  { color: var(--red); text-shadow: 0 0 6px var(--red); }
.budget-bar-track { height: 5px; background: var(--muted); }
.budget-bar-fill  { height: 100%; background: linear-gradient(90deg, #ff6600, #ff3300); transition: width .4s; }
.budget-bar-fill.over { background: var(--red); animation: blink .5s step-end infinite; }
.budget-set-row { display: flex; gap: 6px; margin-top: 8px; }
.budget-input {
  flex: 1; background: var(--bg); color: var(--text);
  border: 1px solid var(--dim); font-family: 'Share Tech Mono', monospace;
  font-size: 12px; padding: 5px 8px; outline: none;
}
.budget-input:focus { border-color: var(--border); }
.budget-set-btn {
  background: none; border: 1px solid var(--border); color: var(--border);
  font-family: 'Share Tech Mono', monospace; font-size: 11px;
  padding: 4px 10px; cursor: pointer;
}
.budget-set-btn:active { background: var(--border); color: var(--bg); }

/* ── FAB ────────────────────────────────────────────── */
.fab {
  position: fixed; bottom: 24px; right: 20px;
  width: 58px; height: 58px; border-radius: 0;
  background: var(--border); color: var(--bg);
  font-size: 28px; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 20px rgba(255,102,0,0.6), 0 0 40px rgba(255,34,0,0.3);
  font-family: 'Share Tech Mono', monospace;
  transition: transform .1s, box-shadow .1s;
  z-index: 100; animation: emberPulse 2s infinite;
}
.fab:active { transform: scale(0.93); }

/* ── Footer ─────────────────────────────────────────── */
footer {
  background: var(--bg); border-top: 1px solid var(--border2);
  padding: 4px 12px; font-size: 9px; color: var(--dim);
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0; letter-spacing: 1px;
}
#status { color: var(--border); }
.status-blink { animation: blink .9s step-end infinite; }

/* ── Modal ──────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.9);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  width: 100%; max-width: 480px;
  background: var(--panel);
  border: 1px solid var(--border); border-bottom: none;
  box-shadow: 0 0 30px rgba(255,102,0,0.4);
  padding: 0 0 env(safe-area-inset-bottom);
  transform: translateY(100%);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
  max-height: 92dvh; overflow-y: auto;
}
.overlay.open .modal { transform: translateY(0); }
.modal-title {
  font-family: 'VT323', monospace; font-size: 22px;
  color: var(--border); padding: 16px 16px 8px;
  border-bottom: 1px solid var(--muted); letter-spacing: 2px;
}
.form-group { padding: 10px 16px 0; }
.form-label { font-size: 10px; color: var(--text3); letter-spacing: 2px; margin-bottom: 5px; display: block; }
.form-input {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--dim); font-family: 'Share Tech Mono', monospace;
  font-size: 14px; padding: 8px 10px; outline: none; -webkit-appearance: none;
}
.form-input:focus { border-color: var(--border); box-shadow: 0 0 8px rgba(255,102,0,0.3); }
textarea.form-input { height: 70px; resize: none; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

.amount-input-wrap { position: relative; }
.amount-prefix {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text3); font-size: 16px; pointer-events: none;
  font-family: 'VT323', monospace;
}
.amount-input-wrap .form-input { padding-left: 22px; font-family: 'VT323', monospace; font-size: 20px; }

.recurring-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px 0; }
.toggle-label { font-size: 10px; color: var(--text3); letter-spacing: 2px; }
.toggle {
  width: 40px; height: 20px; background: var(--muted);
  border: 1px solid var(--dim); position: relative; cursor: pointer;
  transition: background .2s;
}
.toggle.on { background: var(--border); border-color: var(--border); }
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; background: var(--dim);
  transition: transform .2s, background .2s;
}
.toggle.on::after { transform: translateX(20px); background: var(--bg); }

.modal-actions {
  display: flex; gap: 10px; padding: 16px;
  border-top: 1px solid var(--muted); margin-top: 12px;
}
.btn-save {
  flex: 1; background: var(--border); color: var(--bg);
  border: none; font-family: 'Share Tech Mono', monospace;
  font-size: 14px; padding: 12px; cursor: pointer; letter-spacing: 2px;
}
.btn-cancel {
  flex: 1; background: none; color: var(--red);
  border: 1px solid var(--red); font-family: 'Share Tech Mono', monospace;
  font-size: 14px; padding: 12px; cursor: pointer; letter-spacing: 2px;
}
.btn-save:active   { opacity: .8; }
.btn-cancel:active { background: var(--red); color: var(--bg); }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <div class="hdr-row">
      <div>
        <div class="logo glow">BURN<span>//</span>RATE</div>
        <div class="logo-sub">EXPENSE TRACKING SYS v8.0</div>
      </div>
      <div class="clock-block">
        <div id="clock">00:00:00</div>
        <div id="dateline">---</div>
      </div>
    </div>
    <div class="prog-wrap">
      <div class="prog-label">
        <span>🔥 MONTHLY BURN</span>
        <span id="burn-pct">─── NO BUDGET SET ───</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
  </header>

  <!-- Summary -->
  <div class="summary-row">
    <div class="sum-card highlight">
      <div class="sum-label">THIS MONTH</div>
      <div class="sum-value ember" id="sum-month">$0</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">TODAY</div>
      <div class="sum-value" id="sum-today">$0</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">BUDGET LEFT</div>
      <div class="sum-value green" id="sum-left">─</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">TOTAL LOGGED</div>
      <div class="sum-value" id="sum-total">$0</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('expenses')">🔥 EXPENSES</button>
    <button class="tab" onclick="switchTab('budget')">◈ BUDGETS</button>
    <button class="tab" onclick="switchTab('stats')">▦ STATS</button>
  </div>

  <!-- Expenses panel -->
  <div id="panel-expenses" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
    <div class="search-bar">
      <input type="search" id="search-input" placeholder="SEARCH..." oninput="renderExpenses()" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <select id="filter-sel" onchange="renderExpenses()">
        <option value="ALL">ALL CATS</option>
        <option value="FOOD">FOOD</option>
        <option value="TRAVEL">TRAVEL</option>
        <option value="BILLS">BILLS</option>
        <option value="SHOPPING">SHOPPING</option>
        <option value="HEALTH">HEALTH</option>
        <option value="ENTERTAINMENT">ENTERTAIN</option>
        <option value="OTHER">OTHER</option>
      </select>
    </div>
    <!-- Tag filter bar -->
    <div class="tag-filter-bar" id="tag-filter-bar">
      <button class="tag-filter-pill active" id="tag-pill-ALL" onclick="setTagFilter('ALL')">ALL</button>
      <!-- dynamic tag pills injected here -->
      <button class="tag-filter-pill manage" onclick="openTagManager()">⚙ TAGS</button>
    </div>
    <div class="expense-list" id="expense-list"></div>
  </div>

  <!-- Budget panel -->
  <div id="panel-budget" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
    <div class="budget-section" id="budget-section"></div>
  </div>

  <!-- Stats panel -->
  <div id="panel-stats" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
    <div class="expense-list" id="stats-section"></div>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="openModal()" title="Add Expense">+</button>

  <!-- Footer -->
  <footer>
    <span id="status" class="status-blink">█ SYSTEM READY</span>
    <span id="exp-count">0 EXPENSES</span>
  </footer>
</div>

<!-- Expense Modal -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-title" id="modal-title">╔ NEW EXPENSE ╗</div>

    <div class="form-group">
      <label class="form-label">DESCRIPTION *</label>
      <input class="form-input" id="f-name" type="text" placeholder="What did you spend on?" autocomplete="off" autocorrect="off"/>
    </div>

    <div class="form-group">
      <label class="form-label">AMOUNT ($) *</label>
      <div class="amount-input-wrap">
        <span class="amount-prefix">$</span>
        <input class="form-input" id="f-amount" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">CATEGORY</label>
        <select class="form-input" id="f-cat">
          <option>FOOD</option><option>TRAVEL</option><option>BILLS</option>
          <option>SHOPPING</option><option>HEALTH</option><option>ENTERTAINMENT</option><option>OTHER</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">DATE</label>
        <input class="form-input" id="f-date" type="date"/>
      </div>
    </div>

    <!-- Tags picker -->
    <div class="form-group">
      <label class="form-label">TAGS</label>
      <div class="tag-picker" id="tag-picker">
        <span style="font-size:10px;color:var(--dim)">No tags yet — create them via ⚙ TAGS</span>
      </div>
    </div>

    <div class="recurring-row">
      <span class="toggle-label">RECURRING</span>
      <div class="toggle" id="recurring-toggle" onclick="toggleRecurring()"></div>
      <span style="font-size:10px;color:var(--dim)" id="recurring-label">OFF</span>
    </div>

    <div class="form-group">
      <label class="form-label">NOTE</label>
      <textarea class="form-input" id="f-note" placeholder="Optional note..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">[ CANCEL ]</button>
      <button class="btn-save"   onclick="saveExpense()">[ SAVE ]</button>
    </div>
  </div>
</div>

<!-- Tag Manager Modal -->
<div class="tag-mgr-overlay" id="tag-mgr-overlay" onclick="handleTagMgrOverlayClick(event)">
  <div class="tag-mgr-modal">
    <div class="tag-mgr-title">╔ TAG MANAGER ╗</div>
    <div class="tag-mgr-list" id="tag-mgr-list"></div>
    <div class="tag-create-row">
      <input class="tag-create-input" id="tag-new-input" type="text" placeholder="NEW TAG NAME..." maxlength="20"
             autocomplete="off" autocorrect="off" spellcheck="false"
             onkeydown="if(event.key==='Enter') createTag()"/>
      <button class="tag-create-btn" onclick="createTag()">CREATE</button>
    </div>
    <button class="tag-mgr-close" onclick="closeTagManager()">[ CLOSE ]</button>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let expenses    = JSON.parse(localStorage.getItem('br_expenses') || '[]');
let budgets     = JSON.parse(localStorage.getItem('br_budgets')  || '{}');
let userTags    = JSON.parse(localStorage.getItem('br_tags')     || '[]'); // [{id, name}]
let editingId   = null;
let isRecurring = false;
let currentTab  = 'expenses';
let selectedTagsInModal = []; // tag ids selected while editing
let activeTagFilter = 'ALL';  // 'ALL' or a tag id

const CATS = ['FOOD','TRAVEL','BILLS','SHOPPING','HEALTH','ENTERTAINMENT','OTHER'];
const CAT_EMOJI = {FOOD:'🍔',TRAVEL:'✈',BILLS:'⚡',SHOPPING:'🛍',HEALTH:'💊',ENTERTAINMENT:'🎮',OTHER:'◈'};

function save() {
  localStorage.setItem('br_expenses', JSON.stringify(expenses));
  localStorage.setItem('br_budgets',  JSON.stringify(budgets));
  localStorage.setItem('br_tags',     JSON.stringify(userTags));
}
function newId() {
  return expenses.length ? Math.max(...expenses.map(e => e.id||0)) + 1 : 1;
}
function newTagId() {
  return userTags.length ? Math.max(...userTags.map(t => t.id||0)) + 1 : 1;
}

// ── Clock ──────────────────────────────────────────────────────────────────
function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toTimeString().slice(0,8);
  document.getElementById('dateline').textContent = now.toDateString().toUpperCase();
}
setInterval(tickClock, 1000); tickClock();

// ── Date helpers ───────────────────────────────────────────────────────────
function today()     { return new Date().toISOString().slice(0,10); }
function thisMonth() { return new Date().toISOString().slice(0,7); }
function fmt$(n)     { return '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

// ── Summary ────────────────────────────────────────────────────────────────
function updateSummary() {
  const td = today(), tm = thisMonth();
  const monthExp = expenses.filter(e => (e.date||'').startsWith(tm));
  const todayExp = expenses.filter(e => e.date === td);

  const monthTotal = monthExp.reduce((s,e) => s + (e.amount||0), 0);
  const todayTotal = todayExp.reduce((s,e) => s + (e.amount||0), 0);
  const allTotal   = expenses.reduce((s,e) => s + (e.amount||0), 0);

  document.getElementById('sum-month').textContent = fmt$(monthTotal);
  document.getElementById('sum-today').textContent = fmt$(todayTotal);
  document.getElementById('sum-total').textContent = fmt$(allTotal);
  document.getElementById('exp-count').textContent = `${expenses.length} EXPENSES`;

  // Overall monthly budget (sum of all category budgets)
  const totalBudget = Object.values(budgets).reduce((s,b) => s + (b||0), 0);
  const leftEl  = document.getElementById('sum-left');
  const fillEl  = document.getElementById('prog-fill');
  const pctEl   = document.getElementById('burn-pct');

  if (totalBudget > 0) {
    const left = totalBudget - monthTotal;
    const pct  = Math.min(monthTotal / totalBudget * 100, 100);
    leftEl.textContent = fmt$(Math.abs(left));
    leftEl.className   = 'sum-value ' + (left < 0 ? 'red' : 'green');
    fillEl.style.width = pct + '%';
    fillEl.className   = 'prog-fill' + (pct >= 90 ? ' danger' : '');
    pctEl.textContent  = `${pct.toFixed(0)}% BURNED — ${fmt$(left)} LEFT`;
  } else {
    leftEl.textContent = '─';
    leftEl.className   = 'sum-value green';
    fillEl.style.width = '0%';
    pctEl.textContent  = '─── SET BUDGETS TO TRACK ───';
  }
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  ['expenses','budget','stats'].forEach((t,i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', t === tab);
    document.getElementById('panel-'+t).style.display = t === tab ? 'flex' : 'none';
  });
  if (tab === 'budget') renderBudgets();
  if (tab === 'stats')  renderStats();
}

// ── Render expenses ────────────────────────────────────────────────────────
function renderExpenses() {
  const q   = document.getElementById('search-input').value.toLowerCase();
  const flt = document.getElementById('filter-sel').value;
  const list = document.getElementById('expense-list');

  let filtered = [...expenses].sort((a,b) => (b.date||'').localeCompare(a.date||''));
  if (flt !== 'ALL') filtered = filtered.filter(e => e.category === flt);
  if (activeTagFilter !== 'ALL') filtered = filtered.filter(e => (e.tags||[]).includes(activeTagFilter));
  if (q) filtered = filtered.filter(e =>
    e.name.toLowerCase().includes(q) || (e.note||'').toLowerCase().includes(q)
  );

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><span class="big">🔥</span>${q||flt!=='ALL'||activeTagFilter!=='ALL'?'NO MATCHES':'NO EXPENSES YET<br>HIT + TO LOG ONE'}</div>`;
    return;
  }

  // Group by date
  const groups = {};
  filtered.forEach(e => {
    const d = e.date || 'NO DATE';
    if (!groups[d]) groups[d] = [];
    groups[d].push(e);
  });

  let html = '';
  Object.entries(groups).forEach(([date, items]) => {
    const dayTotal = items.reduce((s,e) => s+e.amount, 0);
    const label = date === today() ? '▶ TODAY' : date;
    html += `<div class="date-group">${label} &nbsp;·&nbsp; ${fmt$(dayTotal)}</div>`;
    items.forEach(e => {
      const note = e.note ? `<div class="exp-note">${escHtml(e.note.slice(0,100))}${e.note.length>100?'…':''}</div>` : '';
      const recTag = e.recurring ? `<span class="tag recurring">↻ RECURRING</span>` : '';
      const tagNames = (e.tags||[]).map(tid => {
        const t = userTags.find(t => t.id === tid);
        return t ? `<span class="tag user-tag" onclick="setTagFilter(${tid})">#${escHtml(t.name)}</span>` : '';
      }).join('');
      html += `
      <div class="exp-card ${e.category}" id="ec-${e.id}">
        <div class="exp-top">
          <div class="exp-name">${CAT_EMOJI[e.category]||'◈'} ${escHtml(e.name)}</div>
          <div class="exp-amount">${fmt$(e.amount)}</div>
          <div class="exp-actions">
            <button class="exp-btn edit" onclick="openModal(${e.id})">EDIT</button>
            <button class="exp-btn del"  onclick="deleteExpense(${e.id})">DEL</button>
          </div>
        </div>
        <div class="exp-meta">
          <span class="tag cat">${e.category}</span>
          ${recTag}
          ${tagNames}
        </div>
        ${note}
      </div>`;
    });
  });

  list.innerHTML = html;
  updateSummary();
}

// ── Tag filter bar ─────────────────────────────────────────────────────────
function renderTagFilterBar() {
  const bar = document.getElementById('tag-filter-bar');
  // Clear existing dynamic pills (keep ALL pill and manage btn)
  const allPill  = document.getElementById('tag-pill-ALL');
  const managBtn = bar.lastElementChild;
  bar.innerHTML = '';
  bar.appendChild(allPill);

  userTags.forEach(t => {
    const count = expenses.filter(e => (e.tags||[]).includes(t.id)).length;
    const pill = document.createElement('button');
    pill.className = 'tag-filter-pill' + (activeTagFilter === t.id ? ' active' : '');
    pill.textContent = `#${t.name} (${count})`;
    pill.onclick = () => setTagFilter(t.id);
    bar.appendChild(pill);
  });

  bar.appendChild(managBtn);
  allPill.className = 'tag-filter-pill' + (activeTagFilter === 'ALL' ? ' active' : '');
}

function setTagFilter(tagId) {
  activeTagFilter = tagId;
  renderTagFilterBar();
  renderExpenses();
}

// ── Tag manager ────────────────────────────────────────────────────────────
function openTagManager() {
  renderTagManagerList();
  document.getElementById('tag-mgr-overlay').classList.add('open');
  setTimeout(() => document.getElementById('tag-new-input').focus(), 300);
}
function closeTagManager() {
  document.getElementById('tag-mgr-overlay').classList.remove('open');
  document.getElementById('tag-new-input').value = '';
}
function handleTagMgrOverlayClick(e) {
  if (e.target === document.getElementById('tag-mgr-overlay')) closeTagManager();
}

function renderTagManagerList() {
  const list = document.getElementById('tag-mgr-list');
  if (!userTags.length) {
    list.innerHTML = `<div style="font-size:11px;color:var(--dim);padding:12px 0">No tags yet. Create one below.</div>`;
    return;
  }
  list.innerHTML = userTags.map(t => {
    const count = expenses.filter(e => (e.tags||[]).includes(t.id)).length;
    return `
    <div class="tag-mgr-row">
      <span class="tag-mgr-name">#${escHtml(t.name)}</span>
      <span class="tag-mgr-count">${count} expense${count!==1?'s':''}</span>
      <button class="tag-del-btn" onclick="deleteTag(${t.id})">DEL</button>
    </div>`;
  }).join('');
}

function createTag() {
  const input = document.getElementById('tag-new-input');
  const name  = input.value.trim().toUpperCase().replace(/[^A-Z0-9\-_]/g,'');
  if (!name) return;
  if (userTags.find(t => t.name === name)) { alert('Tag already exists!'); return; }
  userTags.push({ id: newTagId(), name });
  save();
  input.value = '';
  renderTagManagerList();
  renderTagFilterBar();
  renderTagPicker(selectedTagsInModal);
  beep('add');
  setStatus(`# TAG CREATED: ${name}`);
}

function deleteTag(id) {
  if (!confirm('Delete this tag? It will be removed from all expenses.')) return;
  userTags = userTags.filter(t => t.id !== id);
  expenses.forEach(e => { e.tags = (e.tags||[]).filter(tid => tid !== id); });
  if (activeTagFilter === id) activeTagFilter = 'ALL';
  selectedTagsInModal = selectedTagsInModal.filter(tid => tid !== id);
  save();
  renderTagManagerList();
  renderTagFilterBar();
  renderTagPicker(selectedTagsInModal);
  renderExpenses();
  beep('del');
}

// ── Tag picker in modal ────────────────────────────────────────────────────
function renderTagPicker(selectedIds) {
  const picker = document.getElementById('tag-picker');
  if (!userTags.length) {
    picker.innerHTML = `<span style="font-size:10px;color:var(--dim)">No tags yet — create them via ⚙ TAGS</span>`;
    return;
  }
  picker.innerHTML = userTags.map(t => `
    <button class="tag-pick-btn ${selectedIds.includes(t.id)?'selected':''}"
            onclick="toggleTagInModal(${t.id})">#${escHtml(t.name)}</button>
  `).join('');
}

function toggleTagInModal(id) {
  if (selectedTagsInModal.includes(id)) {
    selectedTagsInModal = selectedTagsInModal.filter(t => t !== id);
  } else {
    selectedTagsInModal.push(id);
  }
  renderTagPicker(selectedTagsInModal);
}


function renderBudgets() {
  const tm = thisMonth();
  const section = document.getElementById('budget-section');
  section.innerHTML = CATS.map(cat => {
    const spent  = expenses.filter(e => e.category===cat && (e.date||'').startsWith(tm)).reduce((s,e)=>s+e.amount,0);
    const budget = budgets[cat] || 0;
    const pct    = budget > 0 ? Math.min(spent/budget*100,100) : 0;
    const over   = budget > 0 && spent > budget;
    return `
    <div class="budget-card">
      <div class="budget-card-top">
        <span class="budget-cat">${CAT_EMOJI[cat]} ${cat}</span>
        <span class="budget-amounts">
          <span class="${over?'over':'spent'}">${fmt$(spent)}</span>
          ${budget>0 ? ` / <span>${fmt$(budget)}</span>` : ''}
        </span>
      </div>
      ${budget>0?`<div class="budget-bar-track"><div class="budget-bar-fill${over?' over':''}" style="width:${pct}%"></div></div>`:''}
      <div class="budget-set-row">
        <input class="budget-input" id="bi-${cat}" type="number" min="0" step="1"
          placeholder="SET BUDGET..." value="${budget||''}" inputmode="decimal"/>
        <button class="budget-set-btn" onclick="setBudget('${cat}')">SET</button>
      </div>
    </div>`;
  }).join('');
}

function setBudget(cat) {
  const val = parseFloat(document.getElementById('bi-'+cat).value);
  if (isNaN(val) || val < 0) return;
  budgets[cat] = val;
  save();
  renderBudgets();
  updateSummary();
  setStatus(`◈ BUDGET SET: ${cat} → ${fmt$(val)}`);
}

// ── Stats ──────────────────────────────────────────────────────────────────
function renderStats() {
  const tm = thisMonth();
  const monthExp = expenses.filter(e => (e.date||'').startsWith(tm));
  const section  = document.getElementById('stats-section');

  if (!monthExp.length) {
    section.innerHTML = `<div class="empty-state"><span class="big">▦</span>NO DATA THIS MONTH</div>`;
    return;
  }

  const total = monthExp.reduce((s,e)=>s+e.amount,0);
  const bycat = {};
  CATS.forEach(c => { bycat[c] = monthExp.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0); });

  const sorted = Object.entries(bycat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);

  let html = `<div style="padding:12px 4px 6px;font-size:9px;color:var(--dim);letter-spacing:2px">▦ THIS MONTH BY CATEGORY</div>`;
  sorted.forEach(([cat, amt]) => {
    const pct = total>0 ? amt/total*100 : 0;
    html += `
    <div style="background:var(--panel);border-left:3px solid var(--border);margin-bottom:5px;padding:9px 12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span>${CAT_EMOJI[cat]} ${cat}</span>
        <span style="font-family:VT323,monospace;font-size:20px;color:var(--gold)">${fmt$(amt)}</span>
      </div>
      <div style="height:4px;background:var(--muted)">
        <div style="height:100%;width:${pct.toFixed(1)}%;background:linear-gradient(90deg,#ff6600,#ff2200)"></div>
      </div>
      <div style="font-size:9px;color:var(--dim);margin-top:3px">${pct.toFixed(1)}% OF TOTAL</div>
    </div>`;
  });

  // Top 5 expenses this month
  const top5 = [...monthExp].sort((a,b)=>b.amount-a.amount).slice(0,5);
  html += `<div style="padding:12px 4px 6px;font-size:9px;color:var(--dim);letter-spacing:2px">🔥 TOP EXPENSES THIS MONTH</div>`;
  top5.forEach((e,i) => {
    html += `
    <div style="background:var(--panel);margin-bottom:4px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center">
      <span style="color:var(--dim)">#${i+1}</span>
      <span style="flex:1;padding:0 10px;font-size:12px">${escHtml(e.name)}</span>
      <span style="font-family:VT323,monospace;font-size:18px;color:var(--gold)">${fmt$(e.amount)}</span>
    </div>`;
  });

  section.innerHTML = html;
}

// ── CRUD ───────────────────────────────────────────────────────────────────
function deleteExpense(id) {
  if (!confirm('Delete this expense?')) return;
  expenses = expenses.filter(e => e.id !== id);
  save(); renderExpenses(); beep('del');
  setStatus('✕ EXPENSE DELETED');
}

// ── Modal ──────────────────────────────────────────────────────────────────
function openModal(id = null) {
  editingId = id;
  document.getElementById('modal-title').textContent = id !== null ? '╔ EDIT EXPENSE ╗' : '╔ NEW EXPENSE ╗';

  if (id !== null) {
    const e = expenses.find(e => e.id === id);
    if (!e) return;
    document.getElementById('f-name').value   = e.name;
    document.getElementById('f-amount').value = e.amount;
    document.getElementById('f-cat').value    = e.category;
    document.getElementById('f-date').value   = e.date || '';
    document.getElementById('f-note').value   = e.note || '';
    setRecurring(e.recurring || false);
    selectedTagsInModal = [...(e.tags || [])];
  } else {
    document.getElementById('f-name').value   = '';
    document.getElementById('f-amount').value = '';
    document.getElementById('f-cat').value    = 'FOOD';
    document.getElementById('f-date').value   = today();
    document.getElementById('f-note').value   = '';
    setRecurring(false);
    selectedTagsInModal = [];
  }

  renderTagPicker(selectedTagsInModal);
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 300);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editingId = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

function setRecurring(val) {
  isRecurring = val;
  document.getElementById('recurring-toggle').className = 'toggle' + (val ? ' on' : '');
  document.getElementById('recurring-label').textContent = val ? 'ON' : 'OFF';
}
function toggleRecurring() { setRecurring(!isRecurring); }

function saveExpense() {
  const name   = document.getElementById('f-name').value.trim();
  const amount = parseFloat(document.getElementById('f-amount').value);
  if (!name)          { alert('Description is required!'); return; }
  if (isNaN(amount) || amount <= 0) { alert('Enter a valid amount!'); return; }

  const data = {
    name, amount,
    category:  document.getElementById('f-cat').value,
    date:      document.getElementById('f-date').value || today(),
    note:      document.getElementById('f-note').value.trim(),
    recurring: isRecurring,
    tags:      [...selectedTagsInModal],
  };

  if (editingId !== null) {
    const e = expenses.find(e => e.id === editingId);
    if (e) Object.assign(e, data);
    setStatus('✎ EXPENSE UPDATED');
  } else {
    expenses.push({ id: newId(), createdAt: new Date().toLocaleString(), ...data });
    beep('add');
    setStatus(`+ LOGGED: ${fmt$(amount)}`);
  }

  save(); closeModal(); renderExpenses();
  if (currentTab === 'budget') renderBudgets();
  if (currentTab === 'stats')  renderStats();
}

// ── Sound ──────────────────────────────────────────────────────────────────
let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, dur, type='square', vol=0.07) {
  try {
    const ctx = getCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function beep(t) {
  if (t==='add') { tone(440,.05); setTimeout(()=>tone(660,.08),60); }
  if (t==='del') { tone(180,.15,'sawtooth',.05); }
}

// ── Status ─────────────────────────────────────────────────────────────────
let stTimer;
function setStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg; el.style.color = 'var(--gold)';
  clearTimeout(stTimer);
  stTimer = setTimeout(() => { el.textContent = '█ SYSTEM READY'; el.style.color = ''; }, 3000);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── Init ───────────────────────────────────────────────────────────────────
renderTagFilterBar();
renderExpenses();
updateSummary();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
